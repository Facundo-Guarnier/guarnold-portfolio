name: Desplegar Supabase

# Caller del reutilizable del hub (guarnold-hub). La lógica vive ahí UNA vez: PR a main → Plan
# (solo lectura); push a main o workflow_dispatch → Aplicar + etiqueta supabase/desplegado.
# Pineado por SHA (un tag lo puede mover el dueño; un SHA, no).
# ⚠️ El reutilizable corre en el contexto de ESTE repo: tools/deploy/ y el checkout son de acá.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue por vez en ESTE repo. Entre repos que comparten el proyecto los serializa el
# candado de la base (`pg_advisory_xact_lock` en cada migración). ⊥ se cancela uno en curso.
concurrency:
  group: desplegar-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  desplegar-supabase:
    uses: Facundo-Guarnier/guarnold-hub/.github/workflows/desplegar-supabase.yml@76327aabfd4119adc933211a7fe8c1f80a2f0546  # dev 2026-10-11
    secrets: inherit
    permissions:
      contents: write # el job Aplicar del reutilizable mueve la etiqueta supabase/desplegado

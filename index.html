<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/public/assets/g_icon.png" />
    <link rel="apple-touch-icon" href="/public/assets/g_icon.png" />
    <title>Guarnold Portfolio</title>
    <!-- Google Fonts: Roboto for Material Design feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuration to mimic the tailwind.config.js in the browser for preview purposes -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Roboto", "sans-serif"],
            },
            colors: {
              primary: "var(--md-sys-color-primary)",
              "on-primary": "var(--md-sys-color-on-primary)",
              "primary-container": "var(--md-sys-color-primary-container)",
              "on-primary-container":
                "var(--md-sys-color-on-primary-container)",
              secondary: "var(--md-sys-color-secondary)",
              "on-secondary": "var(--md-sys-color-on-secondary)",
              "secondary-container": "var(--md-sys-color-secondary-container)",
              "on-secondary-container":
                "var(--md-sys-color-on-secondary-container)",
              surface: "var(--md-sys-color-surface)",
              "on-surface": "var(--md-sys-color-on-surface)",
              "surface-variant": "var(--md-sys-color-surface-variant)",
              "on-surface-variant": "var(--md-sys-color-on-surface-variant)",
              background: "var(--md-sys-color-background)",
              "on-background": "var(--md-sys-color-on-background)",
              outline: "var(--md-sys-color-outline)",
            },
          },
        },
      };
    </script>
    <style>
      /* Smooth transition for theme changes */
      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      * {
        transition: background-color 0.3s ease, border-color 0.3s ease,
          color 0.3s ease;
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="bg-background text-on-background">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>

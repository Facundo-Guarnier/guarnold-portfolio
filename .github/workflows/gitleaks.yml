name: Gitleaks

# Escanea SOLO lo que trae el PR (o el push): el rango base..head. El pre-commit ya corre gitleaks,
# pero se salta con `--no-verify`; esto es el control que no se puede saltear.
# Binario oficial del release con sha256 fijado (⊥ gitleaks-action: su licencia pide cuenta paga en orgs).
# La configuracion es la del repo: `.gitleaksignore` (fingerprints de falsos positivos).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Solo lectura: el job ⊥ escribe nada.
permissions:
  contents: read

# Un PR nuevo cancela la corrida anterior del mismo PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # sha256 de gitleaks_8.30.1_linux_x64.tar.gz, tomado de gitleaks_8.30.1_checksums.txt del release.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: Secretos en el rango del PR o push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historia completa)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (release oficial, sha256 fijado)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo install "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Escanear el rango
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            LOG_OPTS="${BEFORE}..${SHA}"
          else
            # Rama nueva sin base conocida: se escanea la historia completa.
            LOG_OPTS=""
          fi
          if [ -n "$LOG_OPTS" ]; then
            gitleaks git --no-banner --redact --log-opts="$LOG_OPTS" .
          else
            gitleaks git --no-banner --redact .
          fi

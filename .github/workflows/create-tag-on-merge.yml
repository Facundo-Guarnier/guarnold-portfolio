name: Create Tag on Main

on:
  push:
    branches:
      - main
    paths:
      - "package.json" # Solo corre si el package.json cambió (lo cual pasó en el PR)

jobs:
  tag-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permiso vital para crear tags
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Read Version from package.json
        id: get_version
        run: |
          # Leemos la versión usando node
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detectada versión: $VERSION"

      - name: Create Git Tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ env.VERSION }}
          tag_prefix: "" # Dejamos vacío para que use exactamente lo del package.json

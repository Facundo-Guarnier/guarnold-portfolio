name: Desplegar Supabase

# Lleva a Supabase (nube) lo que entra a `main`: migraciones pendientes y edge functions cambiadas,
# después de verificar que existen los secretos que el código necesita.
# 🔗 docs/guides/despliegue-supabase.md — por qué ⊥ es `supabase db push` ni la integración de
# GitHub de Supabase (es paga), el orden, y qué hacer cuando frena.
#
# - PR a main → PLAN (solo lectura): qué se aplicaría, y si algo lo impide. ⊥ escribe nada.
# - push a main → APLICAR. Al terminar bien, mueve la etiqueta `supabase/desplegado`: es el
#   punto de partida del próximo (qué functions cambiaron). Si falla, ⊥ se mueve ∴ la próxima
#   corrida vuelve a intentar lo mismo + lo nuevo.
#
# Actions pineadas por SHA (ver test.yml). El CLI de Supabase se baja del release oficial con el
# sha256 FIJADO acá: ⊥ se suma una action de terceros con permiso de escritura.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Un despliegue por vez en ESTE repo. Entre repos que comparten el proyecto los serializa el
# candado de la base (`pg_advisory_xact_lock` en cada migración). ⊥ se cancela uno en curso: una
# migración a medio aplicar ⊥ se interrumpe.
concurrency:
  group: desplegar-supabase
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  SUPABASE_CLI_VERSION: "2.115.0"
  SUPABASE_CLI_SHA256: "ff099608ce758b625532ef03a61f4c9520b995e94ff6cd5480dc0428cad64cb3"

jobs:
  plan:
    name: Plan (solo lectura)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Plan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
        run: node tools/deploy/desplegar-supabase.mjs --plan --desde supabase/desplegado

  desplegar:
    name: Aplicar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      contents: write # mover la etiqueta supabase/desplegado
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar Supabase CLI (release oficial, sha256 fijado)
        run: |
          curl -fsSL -o /tmp/supabase.tgz \
            "https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}/supabase_linux_amd64.tar.gz"
          echo "${SUPABASE_CLI_SHA256}  /tmp/supabase.tgz" | sha256sum -c -
          tar -xzf /tmp/supabase.tgz -C /tmp supabase
          sudo install /tmp/supabase /usr/local/bin/supabase
          supabase --version

      - name: Aplicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROD_REF: ${{ secrets.SUPABASE_PROD_REF }}
        run: node tools/deploy/desplegar-supabase.mjs --aplicar --desde supabase/desplegado

      - name: Mover la etiqueta supabase/desplegado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f supabase/desplegado "$GITHUB_SHA"
          git push -f origin refs/tags/supabase/desplegado

      # Opcional: el front DESPUÉS de la base. Si `NETLIFY_BUILD_HOOK` ⊥ está, se avisa y ⊥ se
      # falla (Netlify sigue construyendo solo, como hasta ahora). Ver la guía §Front.
      - name: Disparar el build del front (Netlify)
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "⊘ NETLIFY_BUILD_HOOK ⊥ configurado: el front lo construye Netlify por su cuenta (puede adelantarse a la base)."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK?trigger_title=supabase-desplegado-$GITHUB_SHA"
          echo "✓ build del front disparado"

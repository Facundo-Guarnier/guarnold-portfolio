# Dependabot — SOLO parches de seguridad, ⊥ actualizaciones de rutina.
#
# Por que asi: con 22 repos, activar las actualizaciones de rutina genera una
# lluvia de PRs que se termina ignorando -- y un Dependabot ignorado es peor que
# no tenerlo, porque tapa las alertas que si importan.
#
# `open-pull-requests-limit: 0` desactiva los PRs de version programados.
# Los PRs de SEGURIDAD (Dependabot security updates) NO dependen de este archivo
# y se siguen creando igual: se activan en
#   Settings -> Code security -> Dependabot security updates
#
# Ver guarnold-hub/TODO.md, Fase 1.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    # Seguridad: todas las alertas juntas en UN PR, ⊥ uno por paquete.
    # Cada merge a main = un deploy en Netlify; 20 PRs sueltos = 20 builds.
    groups:
      seguridad:
        applies-to: "security-updates"
        patterns: ["*"]

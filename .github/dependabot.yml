# Dependabot — actualizaciones MENSUALES, agrupadas, con cooldown.
#
# Por que cambio: con `open-pull-requests-limit: 0` las actions quedaban congeladas (checkout@v3 durante
# meses) y los parches de seguridad de rutina no llegaban. Ahora: un PR por ecosistema y mes, no uno
# por paquete. `cooldown` espera 7 dias antes de proponer una version nueva: si la version sale
# comprometida, la ventana la descubre el registro antes de que llegue un PR.
#
# Los PRs se abren contra `dev` (la rama de trabajo). El merge a `main` sigue siendo por PR del owner.
# Los PRs de SEGURIDAD se crean aparte (grupo `seguridad`) y no cuentan para el limite.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      rutina:
        applies-to: 'version-updates'
        patterns: ['*']
      seguridad:
        applies-to: 'security-updates'
        patterns: ['*']

  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'dev'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      rutina:
        applies-to: 'version-updates'
        patterns: ['*']
      seguridad:
        applies-to: 'security-updates'
        patterns: ['*']

name: Create Tag on Main

# Caller del reutilizable del hub. Solo corre si cambió package.json (lo filtra este caller:
# el reutilizable es workflow_call y no admite `paths`).

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'

permissions:
  contents: read

jobs:
  tag-version:
    uses: Facundo-Guarnier/guarnold-hub/.github/workflows/create-tag-on-merge.yml@76327aabfd4119adc933211a7fe8c1f80a2f0546  # dev 2026-10-11
    secrets: inherit
    permissions:
      contents: write # crear el tag


<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/public/assets/g_icon.png" />
    <link rel="apple-touch-icon" href="/public/assets/g_icon.png" />
    <title>CV - Facundo Guarnier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
        color: #111827;
      }
      
      @media print {
        @page {
          size: A4;
          margin: 0;
        }
        html, body, #root {
          height: auto !important;
          min-height: auto !important;
          overflow: visible !important;
          background-color: white !important;
          min-width: 210mm !important;
          width: 210mm !important;
        }
        body {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        /* Ensure no shadows on print */
        * {
          box-shadow: none !important;
          text-shadow: none !important;
        }
        /* Force 12-column grid layout for print (same as md breakpoint) */
        .print\:grid-cols-12 {
          grid-template-columns: repeat(12, minmax(0, 1fr)) !important;
        }
        .print\:col-span-8 {
          grid-column: span 8 / span 8 !important;
        }
        .print\:col-span-4 {
          grid-column: span 4 / span 4 !important;
        }
        .print\:flex-row {
          flex-direction: row !important;
        }
        .print\:items-end {
          align-items: flex-end !important;
        }
        .print\:text-left {
          text-align: left !important;
        }
        .print\:justify-start {
          justify-content: flex-start !important;
        }
        .print\:justify-end {
          justify-content: flex-end !important;
        }
        .print\:gap-12 {
          gap: 3rem !important;
        }
        .print\:order-1 {
          order: 1 !important;
        }
        .print\:order-2 {
          order: 2 !important;
        }
        .print\:text-6xl {
          font-size: 3.75rem !important;
          line-height: 1 !important;
        }
        .print\:w-40 {
          width: 10rem !important;
        }
        .print\:h-40 {
          height: 10rem !important;
        }
        .print\:mb-0 {
          margin-bottom: 0 !important;
        }
        .print\:overflow-visible {
          overflow: visible !important;
        }
        .print\:h-auto {
          height: auto !important;
        }
        .print\:items-baseline {
          align-items: baseline !important;
        }
        .print\:justify-between {
          justify-content: space-between !important;
        }
        /* Page break control */
        .break-inside-avoid {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
        }
        .print\:break-after-avoid {
          break-after: avoid !important;
          page-break-after: avoid !important;
        }
        .print\:break-before-auto {
          break-before: auto !important;
        }
        .print\:mb-6 {
          margin-bottom: 1.5rem !important;
        }
        
        /* Clase robusta para evitar cortes - CLAVE para ítems individuales */
        .print-break-inside-avoid {
          break-inside: avoid !important;
          page-break-inside: avoid !important;
          display: block !important; /* Flex/Grid a veces impide el salto correcto */
        }
        
        /* Clase para forzar salto de página manual */
        .print-break-before {
          break-before: page !important;
          page-break-before: always !important;
          margin-top: 2rem !important;
        }
        
        /* Ocultar elementos no imprimibles */
        .no-print {
          display: none !important;
        }
        
        /* Asegurar que secciones no empiecen muy cerca del fondo */
        section {
          break-inside: avoid-column;
        }
        
        /* CV Sheet - Eliminar escalado para impresión */
        .cv-sheet {
          transform: none !important;
          width: 210mm !important;
          min-height: auto !important;
        }
        
        /* Reset min-height para print */
        .print\:\!min-h-0 {
          min-height: 0 !important;
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
